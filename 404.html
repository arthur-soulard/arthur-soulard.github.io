<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Arthur Soulard</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0d2438">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/fraunces-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("/fonts/inter-latin-var.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Fraunces";
    font-style: normal;
    font-weight: 500 600;
    font-display: swap;
    src: url("/fonts/fraunces-latin-var.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    --marine: #0d2438;
    --marine-clair: #143a57;
    --accent: #4fb3ac;
    --accent-dark: #297c77;
    --blanc: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--marine) 0%, var(--marine-clair) 100%);
    color: var(--blanc);
    font-family: "Inter", sans-serif;
    line-height: 1.65;
    padding: 2rem 1.4rem;
    text-align: center;
  }

  :focus-visible {
    outline: 3px solid var(--blanc);
    outline-offset: 2px;
    border-radius: 4px;
  }

  main { max-width: 480px; }

  .code {
    font-family: "Fraunces", serif; font-weight: 600;
    font-size: clamp(3.4rem, 14vw, 5rem); line-height: 1;
    color: var(--accent);
    margin-bottom: .6rem;
  }
  h1 {
    font-family: "Fraunces", serif; font-weight: 600;
    font-size: clamp(1.4rem, 5vw, 1.9rem); line-height: 1.2;
    margin-bottom: .9rem;
  }
  p {
    color: rgba(255,255,255,.78);
    font-size: 1rem;
    margin-bottom: 1.8rem;
  }
  .liens { display: flex; gap: .8rem; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-block; padding: .8rem 1.5rem;
    border-radius: 30px; font-size: .92rem; font-weight: 700;
    text-decoration: none; transition: .15s;
  }
  .btn-primary {
    background: var(--accent); color: var(--marine);
    border: 1.5px solid var(--accent);
  }
  .btn-primary:hover { background: var(--blanc); border-color: var(--blanc); }
  .btn-ghost {
    background: transparent; color: var(--blanc);
    border: 1.5px solid rgba(255,255,255,.45);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<main>
  <div class="code">404</div>
  <h1>Cette page n'existe pas</h1>
  <p>Le lien que vous avez suivi est peut-être erroné, ou la page a été déplacée. Tout le contenu du site tient sur la page d'accueil.</p>
  <div class="liens">
    <a class="btn btn-primary" href="/">Retour à l'accueil</a>
    <a class="btn btn-ghost" href="tel:+33749055015">Appeler : 07 49 05 50 15</a>
  </div>
</main>

</body>
</html>
